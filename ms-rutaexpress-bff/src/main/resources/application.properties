spring.application.name=ms-rutaexpress-bff
server.port=8080

# ==========================================
# CONFIGURACIÓN DE CORS Y FRONTEND
# ==========================================
FRONTEND_URL=http://localhost:5173
app.cors.allowed-origins=${FRONTEND_URL}

# ==========================================
# AZURE AD / ENTRA ID
# ==========================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/7ecd33b8-57e2-4e0b-ace8-8c8fd532708f/discovery/v2.0/keys
spring.security.oauth2.resourceserver.jwt.audiences=api://9126af85-b017-4dff-951b-ad782d64adc9

# ==========================================
# RUTAS DEL API GATEWAY (Reactive / WebFlux)
# ==========================================
spring.cloud.gateway.routes[0].id=ms-shipments
spring.cloud.gateway.routes[0].uri=${MS_SHIPMENTS_URL:http://ms-shipments:8085}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/shipments/**

spring.cloud.gateway.routes[1].id=ms-catalog
spring.cloud.gateway.routes[1].uri=${MS_CATALOG_URL:http://ms-catalog:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/catalog/**

spring.cloud.gateway.routes[2].id=ms-report
spring.cloud.gateway.routes[2].uri=${MS_REPORT_URL:http://ms-report:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/report/**

spring.cloud.gateway.routes[3].id=ms-audit
spring.cloud.gateway.routes[3].uri=${MS_AUDIT_URL:http://ms-audit:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/audit/**

spring.cloud.gateway.routes[4].id=ms-notify
spring.cloud.gateway.routes[4].uri=${MS_NOTIFY_URL:http://ms-notify:8082}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/notify/**

# ==========================================
# RUTAS DEL API GATEWAY (WebMVC Compatibility)
# ==========================================
spring.cloud.gateway.mvc.routes[0].id=ms-shipments-mvc
spring.cloud.gateway.mvc.routes[0].uri=${MS_SHIPMENTS_URL:http://ms-shipments:8085}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/shipments/**

spring.cloud.gateway.mvc.routes[1].id=ms-catalog-mvc
spring.cloud.gateway.mvc.routes[1].uri=${MS_CATALOG_URL:http://ms-catalog:8081}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/catalog/**

spring.cloud.gateway.mvc.routes[2].id=ms-report-mvc
spring.cloud.gateway.mvc.routes[2].uri=${MS_REPORT_URL:http://ms-report:8083}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/report/**

spring.cloud.gateway.mvc.routes[3].id=ms-audit-mvc
spring.cloud.gateway.mvc.routes[3].uri=${MS_AUDIT_URL:http://ms-audit:8084}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/audit/**

spring.cloud.gateway.mvc.routes[4].id=ms-notify-mvc
spring.cloud.gateway.mvc.routes[4].uri=${MS_NOTIFY_URL:http://ms-notify:8082}
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/v1/notify/**

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

spring.main.allow-bean-definition-overriding=true