spring.application.name=ms-rutaexpress-bff
server.port=8080

# ==========================================
# AZURE AD / ENTRA ID - Validación de Tokens JWT
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/7ecd33b8-57e2-4e0b-ace8-8c8fd532708f/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/7ecd33b8-57e2-4e0b-ace8-8c8fd532708f/discovery/v2.0/keys
spring.security.oauth2.resourceserver.jwt.audiences=api://9126af85-b017-4dff-951b-ad782d64adc9

# ==========================================
# RUTAS DEL API GATEWAY (Spring Cloud Gateway)
# Las variables ${MS_NAME_URL} permiten inyectar URLs dinámicas en Docker/EC2.
# Si no se inyecta, usa localhost por defecto (modo desarrollo local).
# ==========================================

# 1. Envíos (Shipments)
spring.cloud.gateway.server.webmvc.routes[0].id=ms-shipments
spring.cloud.gateway.server.webmvc.routes[0].uri=${MS_SHIPMENTS_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/shipments/**

# 2. Catálogo (Catalog)
spring.cloud.gateway.server.webmvc.routes[1].id=ms-catalog
spring.cloud.gateway.server.webmvc.routes[1].uri=${MS_CATALOG_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/catalog/**

# 3. Reportes (Report)
spring.cloud.gateway.server.webmvc.routes[2].id=ms-report
spring.cloud.gateway.server.webmvc.routes[2].uri=${MS_REPORT_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/report/**

# 4. Auditoría (Audit)
spring.cloud.gateway.server.webmvc.routes[3].id=ms-audit
spring.cloud.gateway.server.webmvc.routes[3].uri=${MS_AUDIT_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/audit/**

# 5. Notificaciones (Notify)
spring.cloud.gateway.server.webmvc.routes[4].id=ms-notify
spring.cloud.gateway.server.webmvc.routes[4].uri=${MS_NOTIFY_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/notify/**

# Debug de seguridad (útil para ver errores de token en consola)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

spring.main.allow-bean-definition-overriding=true
