spring.application.name=ms-rutaexpress-notify
server.port=8082

# ==========================================
# CONFIGURACIÓN DE RABBITMQ
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:password}

# Modo de confirmación manual de mensajes (ACK / NACK explícito)
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Definición centralizada de colas y exchanges
app.rabbitmq.queue=notification-queue
app.rabbitmq.exchange=notification-exchange
app.rabbitmq.routingkey=notify.key