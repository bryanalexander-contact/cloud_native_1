spring.application.name=ms-rutaexpress-report
server.port=8083

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/rutaexpress_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# RABBITMQ CONFIGURATION
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USER:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

app.rabbitmq.exchange=report.exchange
app.rabbitmq.queue=report.queue
app.rabbitmq.routingkey=report.generated
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# ==========================================
# APACHE KAFKA (CONSUMIDOR Y TÓPICOS)
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
spring.kafka.consumer.group-id=ms-report-group
spring.kafka.consumer.auto-offset-reset=earliest

app.kafka.topic.events=rutaexpress.shipments.events
app.kafka.topic.analytics=rutaexpress.shipments.analytics
