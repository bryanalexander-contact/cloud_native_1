services:
  # ==========================================
  # INFRAESTRUCTURA BASE
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=rutaexpress
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Puerto de comunicación AMQP
      - "15672:15672" # Interfaz de administración web
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  # ==========================================
  # MICROSERVICIOS BACKEND
  # ==========================================
  ms-bff:
    build:
      context: ./ms-rutaexpress-bff
    container_name: ms-bff
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MS_SHIPMENTS_URL=http://ms-shipments:8085
      - MS_CATALOG_URL=http://ms-catalog:8081
      - MS_NOTIFY_URL=http://ms-notify:8082
      - MS_REPORT_URL=http://ms-report:8083
      - MS_AUDIT_URL=http://ms-audit:8084
    depends_on:
      - ms-shipments
      - ms-catalog
      - ms-notify
      - ms-report
      - ms-audit

  ms-shipments:
    build:
      context: ./ms-rutaexpress-shipments
    container_name: ms-shipments
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - rabbitmq
      - postgres-db

  ms-catalog:
    build:
      context: ./ms-rutaexpress-catalog
    container_name: ms-catalog
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - postgres-db

  ms-notify:
    build:
      context: ./ms-rutaexpress-notify
    container_name: ms-notify
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
    depends_on:
      - rabbitmq

  ms-report:
    build:
      context: ./ms-rutaexpress-report
    container_name: ms-report
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - rabbitmq
      - postgres-db

  ms-audit:
    build:
      context: ./ms-rutaexpress-audit
    container_name: ms-audit
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - rabbitmq
      - postgres-db

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend-rutaexpress
    container_name: frontend-rutaexpress
    restart: on-failure
    ports:
      - "5173:80"
    depends_on:
      - ms-bff

volumes:
  postgres_data: