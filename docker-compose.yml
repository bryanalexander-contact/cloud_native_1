version: '3.8'

services:
  # ==========================================
  # INFRAESTRUCTURA BASE
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=rutaexpress
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Puerto de comunicación
      - "15672:15672" # Interfaz de administración web
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # ==========================================
  # MICROSERVICIOS BACKEND
  # ==========================================
  ms-bff:
    build:
      context: ./ms-rutaexpress-bff
    container_name: ms-bff
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MS_SHIPMENTS_URL=http://ms-shipments:8085
      - MS_CATALOG_URL=http://ms-catalog:8081
      - MS_NOTIFY_URL=http://ms-notify:8082
      - MS_REPORT_URL=http://ms-report:8083
      - MS_AUDIT_URL=http://ms-audit:8084
    depends_on:
      - ms-shipments
      - ms-catalog
      - ms-notify
      - ms-report
      - ms-audit

  ms-shipments:
    build:
      context: ./ms-rutaexpress-shipments
    container_name: ms-shipments
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - kafka
      - postgres-db

  ms-catalog:
    build:
      context: ./ms-rutaexpress-catalog
    container_name: ms-catalog
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - postgres-db

  ms-notify:
    build:
      context: ./ms-rutaexpress-notify
    container_name: ms-notify
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
    depends_on:
      - rabbitmq

  ms-report:
    build:
      context: ./ms-rutaexpress-report
    container_name: ms-report
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - kafka
      - postgres-db

  ms-audit:
    build:
      context: ./ms-rutaexpress-audit
    container_name: ms-audit
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/auditdb
    depends_on:
      - kafka
      - mongodb

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend-rutaexpress
    container_name: frontend-rutaexpress
    ports:
      - "5173:80"
    depends_on:
      - ms-bff

volumes:
  postgres_data:
  mongodb_data: