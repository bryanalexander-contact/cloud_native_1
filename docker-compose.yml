services:
  # ==========================================
  # INFRAESTRUCTURA BASE (DB & CLÚSTER RABBITMQ)
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=rutaexpress
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_ERLANG_COOKIE: RUTAEXPRESS_CLUSTER_COOKIE_2026
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 256MiB

  rabbitmq-2:
    image: rabbitmq:3-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    depends_on:
      - rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_ERLANG_COOKIE: RUTAEXPRESS_CLUSTER_COOKIE_2026
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 256MiB
    command: >
      bash -c "
      rabbitmq-server -detached &&
      sleep 12 &&
      rabbitmqctl wait /var/lib/rabbitmq/mnesia/rabbit@rabbitmq-2.pid &&
      rabbitmqctl stop_app &&
      rabbitmqctl reset &&
      rabbitmqctl join_cluster rabbit@rabbitmq &&
      rabbitmqctl start_app &&
      tail -f /dev/null
      "

  # ==========================================
  # CLÚSTER ZOOKEEPER (3 NODOS)
  # ==========================================
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx128M -Xms64M"

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx128M -Xms64M"

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx128M -Xms64M"

  # ==========================================
  # CLÚSTER APACHE KAFKA (3 BROKERS)
  # ==========================================
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-1
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-2
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-3
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"

  # ==========================================
  # KAFKA UI (ADMINISTRACIÓN VISUAL)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rutaexpress-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"

  # ==========================================
  # MICROSERVICIOS BACKEND
  # ==========================================
  ms-bff:
    build:
      context: ./ms-rutaexpress-bff
    container_name: ms-bff
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - MS_SHIPMENTS_URL=http://ms-shipments:8085
      - MS_CATALOG_URL=http://ms-catalog:8081
      - MS_NOTIFY_URL=http://ms-notify:8082
      - MS_REPORT_URL=http://ms-report:8083
      - MS_AUDIT_URL=http://ms-audit:8084
    depends_on:
      - ms-shipments
      - ms-catalog
      - ms-notify
      - ms-report
      - ms-audit

  ms-shipments:
    build:
      context: ./ms-rutaexpress-shipments
    container_name: ms-shipments
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq:5672,rabbitmq-2:5672
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - rabbitmq
      - rabbitmq-2
      - postgres-db
      - kafka-1
      - kafka-2
      - kafka-3

  ms-catalog:
    build:
      context: ./ms-rutaexpress-catalog
    container_name: ms-catalog
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - postgres-db

  ms-notify:
    build:
      context: ./ms-rutaexpress-notify
    container_name: ms-notify
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq:5672,rabbitmq-2:5672
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
    depends_on:
      - rabbitmq
      - rabbitmq-2

  ms-report:
    build:
      context: ./ms-rutaexpress-report
    container_name: ms-report
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq:5672,rabbitmq-2:5672
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - rabbitmq
      - rabbitmq-2
      - postgres-db
      - kafka-1
      - kafka-2
      - kafka-3

  ms-audit:
    build:
      context: ./ms-rutaexpress-audit
    container_name: ms-audit
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq:5672,rabbitmq-2:5672
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/rutaexpress
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - rabbitmq
      - rabbitmq-2
      - postgres-db
      - kafka-1
      - kafka-2
      - kafka-3

  ms-kafka-admin:
    build:
      context: ./ms-rutaexpress-kafka-admin
    container_name: ms-kafka-admin
    restart: on-failure
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend-rutaexpress
    container_name: frontend-rutaexpress
    restart: on-failure
    ports:
      - "5173:80"
    depends_on:
      - ms-bff

volumes:
  postgres_data: