spring.application.name=ms-rutaexpress-shipments
server.port=8085

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/rutaexpress}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# RABBITMQ
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:password}

app.rabbitmq.exchange=shipment.exchange
app.rabbitmq.queue=shipment.queue
app.rabbitmq.routingkey=shipment.status.#

# ==========================================
# APACHE KAFKA (PRODUCTOR)
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topic.events=rutaexpress.shipments.events
app.kafka.topic.analytics=rutaexpress.shipments.analytics

spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:rabbitmq:5672,rabbitmq-2:5672}