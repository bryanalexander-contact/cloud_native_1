spring.application.name=ms-rutaexpress-audit
server.port=8084

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/rutaexpress_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CONFIGURACIÓN DE RABBITMQ
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USER:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Nombre de la Cola y Exchange para Auditoría
app.rabbitmq.exchange=shipment.exchange
app.rabbitmq.queue=shipment.audit.queue
app.rabbitmq.routingkey=shipment.status.#